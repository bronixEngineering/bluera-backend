version: '3.8'
services:
  mint-listener:
    build: ./mint-listener
    container_name: mint-listener
    # comment for coolify
    env_file:
      - .env
    # comment for coolify
    restart: always
    volumes:
      - ./mint-listener:/usr/src/app
    working_dir: /usr/src/app
    command: bash -c "npm install && npm run build && npm run start"

  